[package]
name = "sui-sentinel"
version = "0.1.0"
edition = "2024"
description = "Checkpoint-consistent Suilend position census and cached risk diagnostics"
license = "Apache-2.0"
repository = "https://github.com/john-lawniczak/sui-sentinel-public"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "process"] }
time = { version = "0.3", features = ["parsing", "formatting", "serde", "serde-human-readable"] }
rust_decimal = { version = "1", default-features = false, features = ["serde-with-str", "std"] }
toml = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "json", "time", "macros"] }
sui-rpc = "=0.4.0"
futures-util = "0.3"
tonic = "0.14"
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
rmcp = { version = "=3.8.0", features = ["client", "transport-child-process"] }
tower = { version = "0.5", features = ["util"] }
