name: sui-sentinel

services:
  exporter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SOURCE_REVISION: ${SENTINEL_SOURCE_REVISION:-unrecorded}
    command: [serve-dir, --base, /data, --policy, /config/monitoring.toml, --poll-interval-seconds, '5', --listen, '0.0.0.0:9108']
    volumes:
      - type: bind
        source: ${SENTINEL_DATA_PATH:?Set SENTINEL_DATA_PATH to an absolute generation directory}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - ${SENTINEL_POLICY_PATH:-./config/monitoring.toml}:/config/monitoring.toml:ro
    ports: ['127.0.0.1:9108:9108']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    depends_on: [exporter]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/snapshot.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
